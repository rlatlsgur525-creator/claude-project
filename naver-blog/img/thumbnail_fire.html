<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Pretendard"; font-weight: 700; src: url("../../miracle-shorts/shorts-kit/fonts/Pretendard-Bold.otf"); }
  @font-face { font-family: "Pretendard"; font-weight: 900; src: url("../../miracle-shorts/shorts-kit/fonts/Pretendard-Black.otf"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 860px; height: 645px; overflow: hidden; }
  body { background: #1E2A44; font-family: "Pretendard", "Malgun Gothic", sans-serif; font-weight: 700; color: #fff; position: relative; }
  .wrap { position: absolute; left: 60px; top: 70px; right: 300px; }
  .kw { display: inline-block; font-size: 34px; padding: 10px 22px; border-radius: 12px; background: #C8642A; }
  h1 { margin-top: 34px; font-size: 64px; font-weight: 900; line-height: 1.22; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #F2B27E; }
  .sub { margin-top: 30px; font-size: 30px; color: #C9CFDB; line-height: 1.4; }
  .art { position: absolute; right: 56px; bottom: 60px; }
</style></head>
<body>
  <div class="wrap">
    <div class="kw">가게 화재보험</div>
    <h1>2천만 원 들고<br><em>1,500만 원</em>만<br>받는 이유</h1>
    <div class="sub">건물주 보험, 의무보험만<br>믿으면 안 되는 이유</div>
  </div>
  <svg class="art" width="230" height="420" viewBox="0 0 230 420">
    <path d="M78 30 L150 8" stroke="#C9CFDB" stroke-width="14" stroke-linecap="round"/>
    <rect x="72" y="30" width="66" height="20" rx="6" fill="#C9CFDB"/>
    <rect x="88" y="48" width="34" height="32" fill="#9AA3B5"/>
    <path d="M122 60 q70 0 70 90 v200" stroke="#2B2B2B" stroke-width="14" fill="none" stroke-linecap="round"/>
    <rect x="180" y="340" width="26" height="44" rx="6" fill="#2B2B2B"/>
    <rect x="40" y="76" width="130" height="330" rx="44" fill="#D9534F"/>
    <rect x="58" y="170" width="94" height="120" rx="14" fill="#F7F3EC"/>
    <rect x="72" y="192" width="66" height="10" rx="5" fill="#D9534F"/>
    <rect x="72" y="214" width="46" height="10" rx="5" fill="#D9534F"/>
    <rect x="72" y="236" width="56" height="10" rx="5" fill="#D9534F"/>
    <rect x="56" y="96" width="16" height="290" rx="8" fill="#fff" opacity=".18"/>
  </svg>
</body></html>
